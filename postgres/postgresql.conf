# PostgreSQL 16 configuration for the monitored shop database.
# Sized for a container limited to ~768 MB of RAM.

listen_addresses = '*'
port = 5432
max_connections = 100

# --- Memory -----------------------------------------------------------------
shared_buffers = 192MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# --- Extensions -------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on

# --- Statistics -------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
track_activity_query_size = 2048

# --- Locks ------------------------------------------------------------------
deadlock_timeout = 1s
log_lock_waits = on
lock_timeout = 0

# --- Logging (stderr -> docker -> Loki) -------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d app=%a '
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_autovacuum_min_duration = 1s
log_timezone = 'UTC'

# --- Autovacuum (more aggressive to keep dead tuples visible but bounded) ---
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

timezone = 'UTC'
