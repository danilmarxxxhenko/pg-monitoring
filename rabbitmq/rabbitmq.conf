# Broker configuration. Users come from RABBITMQ_DEFAULT_USER/PASS (.env);
# exchanges and queues are declared idempotently by the services themselves.

# Expose per-queue metrics (queue depth, consumers) on :15692/metrics
prometheus.return_per_object_metrics = true

# Keep the broker within its container memory limit
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 256MB

log.console = true
log.console.level = info
log.console.formatter = json
log.file = false
