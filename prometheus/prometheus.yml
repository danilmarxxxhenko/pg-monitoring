global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: pgmon

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: load-generator
    static_configs:
      - targets: ["load-generator:8080"]
        labels:
          service: load-generator

  - job_name: order-api
    static_configs:
      - targets: ["order-api:8000"]
        labels:
          service: order-api

  - job_name: worker
    static_configs:
      - targets: ["worker:8000"]
        labels:
          service: worker

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: tempo

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          service: alloy

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana

  - job_name: auth
    static_configs:
      - targets: ["auth:8000"]
        labels:
          service: auth

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx
