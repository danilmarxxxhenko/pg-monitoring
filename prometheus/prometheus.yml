global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: pgmon

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: load-generator
    static_configs:
      - targets: ["load-generator:8080"]
        labels:
          service: load-generator

  - job_name: order-api
    static_configs:
      - targets: ["order-api:8000"]
        labels:
          service: order-api

  - job_name: worker
    static_configs:
      - targets: ["worker:8000"]
        labels:
          service: worker

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq
