# nginx: the ONLY entry point of the stack (port 80).
#
#   /login, /logout, /api/token, /auth/api/users  -> auth (public / own checks)
#   /api/*                                         -> order-api (Bearer JWT checked by order-api)
#   /prometheus/*                                  -> Prometheus UI, role admin only
#   /chaos                                         -> load-generator chaos API, role admin only
#   /grafana/*                                     -> Grafana via auth_request, auth.proxy headers
#   /                                              -> redirect to /grafana/
#
# Grafana is served from a sub-path because its own API also lives under
# /api/*, which here belongs to the order API.
#
# Upstreams are resolved through Docker DNS at request time, so restarting a
# container does not break nginx.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $status $log_level {
        ~^5     error;
        ~^4     warning;
        default info;
    }

    # JSON access log -> stdout -> Alloy -> Loki
    log_format json escape=json
        '{"ts":"$time_iso8601","level":"$log_level","service":"nginx",'
        '"client_ip":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","user":"$auth_user",'
        '"user_agent":"$http_user_agent","traceparent":"$http_traceparent"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Role from the auth service -> Grafana organisation role
    map $auth_role $grafana_role {
        admin   Admin;
        viewer  Viewer;
        default "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 1m;

        set $auth_svc       http://auth:8000;
        set $grafana_svc    http://grafana:3000;
        set $order_api_svc  http://order-api:8000;
        set $prometheus_svc http://prometheus:9090;
        set $loadgen_svc    http://load-generator:8080;
        set $auth_user      "";
        set $auth_role      "";

        proxy_http_version 1.1;
        # Defaults for locations without their own proxy_set_header
        include /etc/nginx/proxy_base.conf;
        proxy_set_header Connection "";

        # ------------------------------------------------ auth subrequests
        location = /_auth/grafana {
            internal;
            proxy_pass $auth_svc/verify?scope=grafana;
            proxy_pass_request_body off;
            include /etc/nginx/proxy_base.conf;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }
        location = /_auth/admin {
            internal;
            proxy_pass $auth_svc/verify?scope=admin;
            proxy_pass_request_body off;
            include /etc/nginx/proxy_base.conf;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location @login_redirect {
            # The auth service reads everything after "next=" as the target URI
            return 302 /login?next=$request_uri;
        }
        location @forbidden {
            default_type text/html;
            return 403 '<!doctype html><html lang="uk"><meta charset="utf-8"><title>403</title><body style="font:15px system-ui;padding:40px"><h1>Доступ заборонено</h1><p>Ваша роль не має доступу до цього розділу.</p><p><a href="/">На головну</a> &middot; <a href="/logout">Вийти</a></p></body></html>';
        }

        # ------------------------------------------------- public: auth
        location = /login {
            proxy_pass $auth_svc;
        }
        location = /logout {
            proxy_pass $auth_svc;
        }
        location = /api/token {
            proxy_pass $auth_svc;
        }
        location ^~ /auth/api/users {
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass $auth_svc;
        }

        # ---------------------------------------------------- order API
        # Internal service endpoints are not exposed
        location ~ ^/api/(metrics|health)$ {
            return 404;
        }
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $order_api_svc;
        }

        # ------------------------------------------------ admin only
        location ^~ /prometheus/ {
            auth_request /_auth/admin;
            auth_request_set $auth_user $upstream_http_x_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_pass $prometheus_svc;
        }
        location = /prometheus {
            return 301 /prometheus/;
        }
        location = /chaos {
            auth_request /_auth/admin;
            auth_request_set $auth_user $upstream_http_x_user;
            proxy_pass $loadgen_svc/chaos;
        }

        # -------------------------------------------------------- Grafana
        location /grafana/api/live/ {
            auth_request /_auth/grafana;
            auth_request_set $auth_user $upstream_http_x_user;
            auth_request_set $auth_role $upstream_http_x_role;
            include /etc/nginx/proxy_base.conf;
            # Identity headers are always overwritten: client-sent values never pass
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-ROLE $grafana_role;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass $grafana_svc;
        }
        location /grafana/ {
            auth_request /_auth/grafana;
            auth_request_set $auth_user $upstream_http_x_user;
            auth_request_set $auth_role $upstream_http_x_role;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;
            include /etc/nginx/proxy_base.conf;
            proxy_set_header Connection "";
            # Identity headers are always overwritten: client-sent values never pass
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-ROLE $grafana_role;
            proxy_pass $grafana_svc;
        }

        location = / {
            return 302 /grafana/;
        }
        location = /grafana {
            return 301 /grafana/;
        }
        location / {
            return 404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }

    # stub_status for nginx-prometheus-exporter; this port is NOT published
    server {
        listen 8081;
        access_log off;
        location = /stub_status {
            stub_status;
        }
    }
}
