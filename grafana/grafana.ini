[server]
http_port = 3000
# Public URL behind nginx (sub-path /grafana/); overridden by GF_SERVER_ROOT_URL
root_url = http://localhost/grafana/
serve_from_sub_path = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[users]
default_theme = system
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

# --- Authentication: only through nginx + own auth service -----------------
[auth]
# Grafana's own login form and basic auth are switched off
disable_login_form = true
disable_signout_menu = false
signout_redirect_url = /logout
oauth_auto_login = false

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
# Org role comes from the auth service: admin -> Admin, viewer -> Viewer
headers = Role:X-WEBAUTH-ROLE
sync_ttl = 1
# Only nginx (static IP in the compose network) may assert identities;
# set via GF_AUTH_PROXY_WHITELIST in docker-compose.yml
whitelist = 172.28.0.10
enable_login_token = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/postgres.json

[log]
mode = console
level = info

[log.console]
format = json

[security]
x_xss_protection = false
cookie_samesite = lax
disable_initial_admin_creation = false
