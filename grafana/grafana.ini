[server]
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[users]
default_theme = system
allow_sign_up = false

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/postgres.json

[log]
mode = console
level = info

[log.console]
format = json

[security]
x_xss_protection = false
cookie_samesite = lax
