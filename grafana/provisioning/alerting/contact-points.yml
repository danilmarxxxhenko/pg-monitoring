apiVersion: 1

# Grafana-managed alerting (no separate Alertmanager in the stack).
# Notifications go to a webhook of the load generator, which writes each one
# as a log line (event="alert") -> Loki, so alerts are visible in logs too.
contactPoints:
  - orgId: 1
    name: pgmon-webhook
    receivers:
      - uid: pgmon-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://load-generator:8080/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: pgmon-webhook
    group_by: ["grafana_folder", "alertname"]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
