# PostgreSQL performance monitoring stack for the online-shop order service.
# Start: `docker compose up -d` (or `make up`, which also creates .env).

name: ${COMPOSE_PROJECT_NAME:-pgmon}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-python-service: &python-service
  restart: unless-stopped
  logging: *default-logging
  environment: &python-env
    LOG_LEVEL: INFO
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    OTEL_TRACES_SAMPLER_RATIO: "1.0"

services:
  # ---------------------------------------------------------------- database
  postgres:
    image: postgres:16.16-bookworm
    restart: unless-stopped
    logging: *default-logging
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      GENERATOR_DB_USER: ${GENERATOR_DB_USER}
      GENERATOR_DB_PASSWORD: ${GENERATOR_DB_PASSWORD}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary server used during init scripts listens on the
      # unix socket only, so the service turns healthy after init completes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    shm_size: 256m
    mem_limit: 768m

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=200
      - --collector.long_running_transactions
      - --collector.database_wraparound
      - --collector.statio_user_tables
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${EXPORTER_DB_USER}
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 10s
      retries: 5
    mem_limit: 96m

  # --------------------------------------------------------------- messaging
  rabbitmq:
    image: rabbitmq:4.3.7-management
    restart: unless-stopped
    logging: *default-logging
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-pgmon.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    # Management UI for debugging only, bound to localhost (login from .env)
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    mem_limit: 400m

  # ------------------------------------------------------------ applications
  auth:
    <<: *python-service
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    image: pgmon/auth:1.0.0
    environment:
      <<: *python-env
      SERVICE_NAME: auth
      AUTH_DB_PATH: /data/auth.sqlite3
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ADMIN_USER: ${AUTH_ADMIN_USER}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_VIEWER_USER: ${AUTH_VIEWER_USER}
      AUTH_VIEWER_PASSWORD: ${AUTH_VIEWER_PASSWORD}
      AUTH_SERVICE_USER: ${AUTH_SERVICE_USER}
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
    volumes:
      - auth-data:/data
    depends_on:
      alloy:
        condition: service_healthy
    mem_limit: 128m

  order-api:
    <<: *python-service
    build:
      context: ./services
      dockerfile: order_api/Dockerfile
    image: pgmon/order-api:1.0.0
    environment:
      <<: *python-env
      SERVICE_NAME: order-api
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AUTH_ENABLED: "true"
      AUTH_URL: http://auth:8000
    depends_on:
      alloy:
        condition: service_healthy
      auth:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 192m

  worker:
    <<: *python-service
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    image: pgmon/worker:1.0.0
    environment:
      <<: *python-env
      SERVICE_NAME: worker
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      WORKER_PREFETCH: "10"
      PAYMENT_FAILURE_RATE: "0.1"
      CHAOS_PAYMENT_FAILURE_RATE: "0.7"
    depends_on:
      alloy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 160m

  load-generator:
    <<: *python-service
    build:
      context: ./services
      dockerfile: load_generator/Dockerfile
    image: pgmon/load-generator:1.0.0
    environment:
      <<: *python-env
      SERVICE_NAME: load-generator
      USERS: ${USERS}
      RPS: ${RPS}
      # All shopper traffic goes through the public entry point (nginx)
      API_URL: http://nginx/api
      TOKEN_URL: http://nginx/api/token
      SERVICE_USER: ${AUTH_SERVICE_USER}
      SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${GENERATOR_DB_USER}
      DB_PASSWORD: ${GENERATOR_DB_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      alloy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      order-api:
        condition: service_healthy
      worker:
        condition: service_healthy
      nginx:
        condition: service_healthy
    mem_limit: 192m

  # ----------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      # UI links are generated under /prometheus/ (nginx strips the prefix)
      - --web.external-url=/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 448m

  loki:
    build: ./loki
    image: pgmon/loki:3.7.10
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    mem_limit: 384m

  tempo:
    build: ./tempo
    image: pgmon/tempo:2.10.10
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/tempo/tempo.yml"]
    # Upstream image runs as uid 10001; the named volume must be writable by it
    user: "10001:10001"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    mem_limit: 352m

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-pgmon}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      # The built-in admin has the same login as the auth-service admin, so
      # that user becomes Grafana Server Admin when signed in via auth.proxy.
      GF_SECURITY_ADMIN_USER: ${AUTH_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost}/grafana/
      GF_AUTH_PROXY_WHITELIST: 172.28.0.10
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # No published ports: reachable only through nginx
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/grafana/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  # ------------------------------------------------------------ entry point
  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_base.conf:/etc/nginx/proxy_base.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      default:
        # Static address: Grafana trusts auth.proxy headers from this IP only
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 64m

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    logging: *default-logging
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      nginx:
        condition: service_healthy
    mem_limit: 32m

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  auth-data:
  pgdata:
  prometheus-data:
  grafana-data:
  rabbitmq-data:
  loki-data:
  tempo-data:
  alloy-data:
